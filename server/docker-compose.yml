services:
  frontend:
    build:
      context: ../client
      args:
        VITE_API_URL: http://localhost/api/v1
    container_name: frontend
    expose:
      - "80"
    networks:
      - app-network

  backend:
    build: .
    container_name: backend
    env_file:
      - .env
    expose:
      - "8001"
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  migrate:
    image: server-backend:latest
    container_name: migrate
    working_dir: /app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    networks:
      - app-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eventhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d eventhub"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    ports:
      - "5432:5432"

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge